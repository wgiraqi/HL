<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09291d">
<title>لوحة إدارة مركز أمان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--green:#0b3324;--green2:#145a3f;--green3:#e7f2eb;--gold:#d4a438;--ink:#17352a;--muted:#718078;--line:#e5ece7;--bg:#f4f7f5;--white:#fff;--red:#b42318;--shadow:0 14px 40px rgba(12,48,33,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 15%,#1b735133,transparent 28%),radial-gradient(circle at 85% 85%,#d4a43822,transparent 30%),linear-gradient(135deg,#051811,#0b3324 60%,#13533a)}
.login-card{width:min(100%,430px);background:#fffffffa;border:1px solid #d4a43866;border-radius:28px;padding:34px;box-shadow:0 28px 80px #0004;text-align:center}.logo{width:86px;height:86px;border-radius:25px;object-fit:contain;background:#e7f2eb;padding:9px;border:1px solid #d4a43866}.logo-fallback{width:86px;height:86px;margin:auto;border-radius:25px;background:var(--green);color:#f4d88d;display:grid;place-items:center;font-size:30px;font-weight:900;border:2px solid var(--gold)}.eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--green3);color:var(--green);border:1px solid #145a3f22;border-radius:30px;padding:7px 13px;font-size:12px;font-weight:800;margin:18px 0 8px}.dot{width:7px;height:7px;border-radius:50%;background:#23945d}.login-card h1{font-size:27px;margin:6px 0;color:var(--green)}.sub{color:var(--muted);font-size:14px;line-height:1.8;margin:8px 0 25px}
.field{text-align:right;margin:15px 0}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 8px}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #dce6df;border-radius:13px;background:#fbfdfb;outline:none;color:var(--ink)}.field input:focus,.field select:focus{border-color:var(--green2);box-shadow:0 0 0 3px #145a3f18}
.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.primary{background:var(--green2);color:white}.gold{background:#f6edda;color:#785510;border:1px solid #e8d6a8}.outline{background:white;color:var(--green);border:1px solid #cbd9d0}.danger{background:#fff0ee;color:var(--red);border:1px solid #f3d0cc}.wide{width:100%;padding:14px}.error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px}.hint{font-size:11px;color:#8a968f;margin-top:15px}
.app{min-height:100vh}.topbar{background:linear-gradient(105deg,#061c14,#0b3324 65%,#145a3f);color:#fff;padding:17px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 5px 22px #082b1c22}.brand{display:flex;align-items:center;gap:13px}.brand .logo,.brand .logo-fallback{width:48px;height:48px;border-radius:14px;font-size:19px}.brand-title{font-weight:900;font-size:19px}.brand-sub{font-size:11px;color:#c4d7ca;margin-top:2px}.top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.topbar .outline{background:#ffffff12;color:white;border-color:#ffffff44}.topbar .gold{background:#d4a438;color:#1d2d22;border:0}
.container{width:min(1400px,100%);margin:auto;padding:28px clamp(14px,3vw,38px) 55px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:23px}.welcome h2{font-size:26px;margin:0;color:var(--green)}.welcome p{margin:6px 0 0;color:var(--muted);font-size:14px}.refresh-meta{font-size:12px;color:var(--muted);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.stat{background:white;border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:0 4px 18px #0b33240a;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;left:-18px;bottom:-28px;width:90px;height:90px;border-radius:50%;background:#e7f2eb}.stat-label{color:var(--muted);font-size:13px;font-weight:700}.stat-value{font-size:30px;font-weight:900;color:var(--green);margin-top:8px;position:relative;z-index:1}.stat-icon{float:left;color:#b58a2e;font-size:21px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.section-head h3{margin:0;font-size:19px;color:var(--green)}.section-head small{color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{min-width:220px;flex:1;max-width:360px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;outline:none}
.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.group-card{background:white;border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:0 5px 18px #0b33240a;transition:.2s}.group-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#b9d2c2}.group-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.group-name{font-size:16px;font-weight:900;line-height:1.6;color:var(--green)}.count-pill{white-space:nowrap;background:var(--green3);color:var(--green2);padding:6px 10px;border-radius:30px;font-size:12px;font-weight:900}.group-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:19px;padding-top:14px;border-top:1px solid #edf1ee}.group-foot span{font-size:12px;color:var(--muted)}
.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 5px 20px #0b332408;margin-top:18px}.export-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.export-btn{background:#f7faf8;border:1px solid #e1ebe4;color:var(--green);border-radius:13px;padding:13px 10px;font-weight:800;text-align:center}.export-btn:hover{background:var(--green3);border-color:#b9d2c2}.export-btn small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:4px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.page-head h2{margin:0;color:var(--green);font-size:23px}.page-head p{margin:4px 0;color:var(--muted);font-size:13px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:1050px;background:white}th{background:#eff6f1;color:var(--green);font-size:12px;text-align:right;padding:13px 12px;white-space:nowrap}td{padding:12px;border-top:1px solid #edf1ee;font-size:12px;vertical-align:top}tr:hover td{background:#fbfdfb}.muted{color:var(--muted)}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#e7f2eb;color:#145a3f;font-size:11px;font-weight:800}
.custom-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:16px}.notice{padding:12px 14px;border-radius:12px;background:#f7faf8;color:#52645a;font-size:12px;line-height:1.8;margin-top:12px;border:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:22px;z-index:20;background:#0b3324;color:white;padding:13px 18px;border-radius:13px;box-shadow:var(--shadow);font-size:13px;max-width:min(90vw,420px)}.toast.bad{background:#9f241c}
.loading{opacity:.65;pointer-events:none}.empty{padding:35px;text-align:center;color:var(--muted);background:white;border:1px dashed #cbd9d0;border-radius:17px}.spinner{width:16px;height:16px;border:2px solid #ffffff66;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;color:#95a39a;font-size:11px;margin-top:35px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.groups{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.topbar{align-items:flex-start}.brand-title{font-size:16px}.top-actions .btn{padding:9px 10px;font-size:11px}.container{padding-top:20px}.welcome{align-items:flex-start;flex-direction:column}.welcome h2{font-size:22px}.stats{gap:9px}.stat{padding:14px}.stat-value{font-size:25px}.groups{grid-template-columns:1fr}.export-grid{grid-template-columns:repeat(2,1fr)}.custom-row{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.search{max-width:none;width:100%}.login-card{padding:27px 22px}}
